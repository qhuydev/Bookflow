spring:
  application:
    name: bookflow-api

bookflow:
  booking:
    hold-minutes: ${BOOKFLOW_BOOKING_HOLD_MINUTES:10}
    expiry-batch-size: ${BOOKFLOW_BOOKING_EXPIRY_BATCH_SIZE:100}
    expiry-interval: ${BOOKFLOW_BOOKING_EXPIRY_INTERVAL:PT30S}
    expiry-enabled: ${BOOKFLOW_BOOKING_EXPIRY_ENABLED:true}
  availability:
    slot-step-minutes: ${BOOKFLOW_AVAILABILITY_SLOT_STEP_MINUTES:15}
    default-lead-time-minutes: ${BOOKFLOW_AVAILABILITY_DEFAULT_LEAD_TIME_MINUTES:0}
  authentication:
    password:
      argon2:
        salt-length: 16
        hash-length: 32
        parallelism: 1
        memory-kib: 19456
        iterations: 2
    session:
      inactivity-days: 7
      absolute-days: 30
    access-token:
      issuer: urn:bookflow:auth
      audience: bookflow-api
      client-id: bookflow-web
      expires-in-seconds: 900
    refresh-cookie:
      name: bookflow_refresh
      secure: ${BOOKFLOW_AUTH_REFRESH_COOKIE_SECURE:true}
      same-site: Lax
      path: /api/v1/auth
    cors:
      allowed-origins: ${BOOKFLOW_CORS_ALLOWED_ORIGINS:}
    password-reset:
      ttl-minutes: ${BOOKFLOW_AUTH_PASSWORD_RESET_TTL_MINUTES:30}
    rate-limit:
      enabled: ${BOOKFLOW_AUTH_RATE_LIMIT_ENABLED:true}
      fail-open: ${BOOKFLOW_AUTH_RATE_LIMIT_FAIL_OPEN:false}
      window-seconds: ${BOOKFLOW_AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
      account-limit: ${BOOKFLOW_AUTH_RATE_LIMIT_ACCOUNT_LIMIT:5}
      ip-limit: ${BOOKFLOW_AUTH_RATE_LIMIT_IP_LIMIT:20}
      trusted-proxies: ${BOOKFLOW_AUTH_RATE_LIMIT_TRUSTED_PROXIES:}

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  show-actuator: false
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    url: /v3/api-docs
    disable-swagger-default-url: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Không để DEBUG logging của Spring MVC serialize access/CSRF token vào log.
logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation: INFO
